<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Diabetes Patient Management</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #dde2ea;
    --accent: #2f6fdb;
    --accent-soft: #e8f0fd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .card {
    max-width: 560px;
    margin: 0 auto 24px;
    background: var(--card);
    border-radius: 14px;
    box-shadow: 0 4px 24px rgba(15, 23, 42, .06);
    overflow: hidden;
  }
  .topbar {
    padding: 18px 28px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    font-weight: 600;
  }
  main { padding: 28px; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  h2 { margin: 0 0 4px; font-size: 18px; }
  .sub { margin: 0 0 24px; color: var(--muted); font-size: 14px; }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  .full { grid-column: 1 / -1; }
  label {
    display: block;
    margin-bottom: 6px;
    font-size: 14px;
    font-weight: 600;
  }
  input, select {
    width: 100%;
    height: 42px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 15px;
  }
  input:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  .actions { margin-top: 24px; display: flex; justify-content: flex-end; }
  button {
    padding: 11px 28px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font: inherit;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
  }
  button:hover { background: #2559b8; }
  button:disabled { opacity: .6; cursor: wait; }
  .message {
    display: none;
    margin-top: 18px;
    padding: 12px 14px;
    border-radius: 8px;
    background: #ecfdf3;
    color: #166534;
    font-size: 14px;
  }
  .message.show { display: block; }
  .message.error { background: #fef2f2; color: #991b1b; }
  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: 8px 16px;
    margin: 0;
    font-size: 14px;
  }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  .badge {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 999px;
    font-size: 13px;
  }
  .badge.LOW { background: #ecfdf3; color: #166534; }
  .badge.MEDIUM { background: #fffbeb; color: #92400e; }
  .badge.HIGH { background: #fef2f2; color: #991b1b; }
  .card.wide { max-width: 960px; }
  .table-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr.new td { background: var(--accent-soft); }
  .link-button { padding: 0; background: none; color: var(--accent); font-size: 14px; }
  .link-button:hover { background: none; text-decoration: underline; }
  [hidden] { display: none !important; }
  @media (max-width: 520px) {
    body { padding: 16px; }
    main { padding: 22px 18px; }
    .grid { grid-template-columns: 1fr; }
    button { width: 100%; }
  }
</style>
</head>
<body>
  <div class="card">
    <header class="topbar">Diabetes Patient Management</header>
    <main>
      <h1>Add Patient Encounter</h1>
      <p class="sub">Enter the encounter details below.</p>
      <form id="encounterForm">
        <div class="grid">
          <div>
            <label for="patient_nbr">Patient Number</label>
            <input id="patient_nbr" name="patient_nbr" type="number" min="1" required autocomplete="off" />
          </div>
          <div>
            <label for="age">Age</label>
            <select id="age" name="age" required>
              <option value="">Select age</option>
              <option value="[0-10)">0–9 years</option>
              <option value="[10-20)">10–19 years</option>
              <option value="[20-30)">20–29 years</option>
              <option value="[30-40)">30–39 years</option>
              <option value="[40-50)">40–49 years</option>
              <option value="[50-60)">50–59 years</option>
              <option value="[60-70)">60–69 years</option>
              <option value="[70-80)">70–79 years</option>
              <option value="[80-90)">80–89 years</option>
              <option value="[90-100)">90–99 years</option>
            </select>
          </div>
          <div>
            <label for="time_in_hospital">Time in Hospital (days)</label>
            <input id="time_in_hospital" name="time_in_hospital" type="number" min="0" required />
          </div>
          <div>
            <label for="num_medications">Medications</label>
            <input id="num_medications" name="num_medications" type="number" min="0" required />
          </div>
          <div>
            <label for="number_inpatient">Inpatient Visits</label>
            <input id="number_inpatient" name="number_inpatient" type="number" min="0" value="0" required />
          </div>
          <div>
            <label for="number_emergency">Emergency Visits</label>
            <input id="number_emergency" name="number_emergency" type="number" min="0" value="0" required />
          </div>
          <div>
            <label for="number_outpatient">Outpatient Visits</label>
            <input id="number_outpatient" name="number_outpatient" type="number" min="0" value="0" required />
          </div>
          <div>
            <label for="num_lab_procedures">Lab Procedures</label>
            <input id="num_lab_procedures" name="num_lab_procedures" type="number" min="0" value="0" required />
          </div>
          <div>
            <label for="admission_type_id">Admission Type ID</label>
            <input id="admission_type_id" name="admission_type_id" type="number" min="0" value="1" required />
          </div>
          <div>
            <label for="discharge_disposition_id">Discharge Disposition ID</label>
            <input id="discharge_disposition_id" name="discharge_disposition_id" type="number" min="0" value="1" required />
          </div>
        </div>
        <div class="actions">
          <button type="submit" id="submitButton">Add Encounter</button>
        </div>
        <div class="message" id="message" role="status"></div>
      </form>
    </main>
  </div>

  <div class="card" id="resultCard" hidden>
    <main>
      <h2>Saved Encounter</h2>
      <p class="sub" id="resultSource"></p>
      <dl id="resultList"></dl>
    </main>
  </div>

  <div class="card wide">
    <main>
      <div class="table-head">
        <h2>Recent Encounters</h2>
        <button type="button" class="link-button" id="refreshButton">Refresh</button>
      </div>
      <p class="sub" id="tableStatus">Loading…</p>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Encounter ID</th>
              <th>Patient</th>
              <th>Age</th>
              <th class="num">Days</th>
              <th class="num">Inpatient</th>
              <th class="num">Emergency</th>
              <th class="num">Outpatient</th>
              <th class="num">Meds</th>
              <th class="num">Labs</th>
              <th class="num">Admission Type</th>
              <th class="num">Discharge Disp.</th>
              <th>Readmitted</th>
              <th class="num">Score</th>
              <th>Risk</th>
            </tr>
          </thead>
          <tbody id="encounterRows"></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- Compiled from encounter_api.ts: run `tsc -p .` in Day6, then serve this folder over http (ES modules do not load from file://). -->
  <script>
    if (location.protocol === "file:") {
      const text = "This page was opened as a file, so the browser blocks the API script. Open http://localhost:8000/diabetes_patient_management.html instead (run `python3 -m http.server 5500` in the Day6 folder).";
      document.getElementById("tableStatus").textContent = text;
      const message = document.getElementById("message");
      message.textContent = text;
      message.classList.add("show", "error");
    }
  </script>
  <script type="module">
    import { createEncounter, getEncounterById, getEncounters } from "./dist/encounter_api.js";

    const form = document.getElementById("encounterForm");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const resultCard = document.getElementById("resultCard");
    const resultSource = document.getElementById("resultSource");
    const resultList = document.getElementById("resultList");
    const encounterRows = document.getElementById("encounterRows");
    const tableStatus = document.getElementById("tableStatus");
    const refreshButton = document.getElementById("refreshButton");

    const TABLE_COLUMNS = ["encounter_id", "patient_nbr", "age", "time_in_hospital", "number_inpatient", "number_emergency", "number_outpatient", "num_medications", "num_lab_procedures", "admission_type_id", "discharge_disposition_id", "readmitted", "risk_score", "risk_level"];
    const TEXT_COLUMNS = new Set(["encounter_id", "patient_nbr", "age", "readmitted", "risk_level"]);

    // Newest first: the API sorts by encounter_id DESC, and new encounters get the highest id.
    async function loadTable(highlightId) {
      try {
        const encounters = await getEncounters(20);
        encounterRows.replaceChildren(...encounters.map((encounter) => {
          const tr = document.createElement("tr");
          if (encounter.encounter_id === highlightId) tr.className = "new";
          for (const key of TABLE_COLUMNS) {
            const td = document.createElement("td");
            if (!TEXT_COLUMNS.has(key)) td.className = "num";
            if (key === "risk_level") {
              const badge = document.createElement("span");
              badge.className = `badge ${encounter.risk_level}`;
              badge.textContent = encounter.risk_level;
              td.append(badge);
            } else {
              td.textContent = encounter[key];
            }
            tr.append(td);
          }
          return tr;
        }));
        tableStatus.textContent = `Latest ${encounters.length} encounters from GET /encounters, newest first.`;
      } catch (error) {
        tableStatus.textContent = `Could not load encounters: ${error.message}`;
      }
    }

    refreshButton.addEventListener("click", () => loadTable());
    loadTable();

    const FIELDS = [
      ["encounter_id", "Encounter ID"],
      ["patient_nbr", "Patient Number"],
      ["age", "Age"],
      ["time_in_hospital", "Time in Hospital"],
      ["number_inpatient", "Inpatient Visits"],
      ["number_emergency", "Emergency Visits"],
      ["number_outpatient", "Outpatient Visits"],
      ["num_medications", "Medications"],
      ["num_lab_procedures", "Lab Procedures"],
      ["admission_type_id", "Admission Type ID"],
      ["discharge_disposition_id", "Discharge Disposition ID"],
      ["risk_score", "Risk Score"],
      ["risk_level", "Risk Level"],
      ["intervention_status", "Care Intervention"],
    ];

    function showMessage(text, isError = false) {
      message.textContent = text;
      message.classList.toggle("error", isError);
      message.classList.add("show");
    }

    function readForm() {
      const data = Object.fromEntries(new FormData(form));
      for (const key of Object.keys(data)) {
        if (key !== "age") data[key] = Number(data[key]);
      }
      return data;
    }

    function renderEncounter(encounter) {
      resultList.replaceChildren();
      for (const [key, label] of FIELDS) {
        const dt = document.createElement("dt");
        dt.textContent = label;
        const dd = document.createElement("dd");
        const value = encounter[key];
        if (key === "risk_level") {
          const badge = document.createElement("span");
          badge.className = `badge ${value}`;
          badge.textContent = value;
          dd.append(badge);
        } else {
          dd.textContent = value ?? "Not queued (LOW risk)";
        }
        resultList.append(dt, dd);
      }
      resultSource.textContent = `Loaded from GET /encounters/${encounter.encounter_id} at ${new Date().toLocaleTimeString()}`;
      resultCard.hidden = false;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      submitButton.disabled = true;
      try {
        const created = await createEncounter(readForm());
        // Read it back from the database so the UI shows what was actually stored.
        const saved = await getEncounterById(created.encounter_id);
        renderEncounter(saved);
        await loadTable(saved.encounter_id);
        showMessage(`Encounter ${saved.encounter_id} added (${saved.risk_level} risk).`);
        form.reset();
      } catch (error) {
        showMessage(`Could not add encounter: ${error.message}`, true);
      } finally {
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
